<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>25 Dot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --turf-dark:#173425;
    --turf:#1f4a30;
    --turf-light:#2e6b45;
    --cream:#f4f1e6;
    --card:#fffdf7;
    --sand:#c9a66b;
    --sand-dark:#a5824f;
    --flag:#b3402f;
    --ink:#1b1f1a;
    --ink-soft:#5a6058;
    --line:#e2ddc9;
    --good:#2e6b45;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; overscroll-behavior:none;}
  body{
    font-family:'Work Sans', sans-serif;
    background:var(--turf-dark);
    color:var(--ink);
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
  }
  .display{font-family:'Big Shoulders Display', sans-serif;}
  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit;}

  /* ---------- Top bar ---------- */
  .topbar{
    background:var(--turf-dark);
    color:var(--cream);
    padding:14px 18px 12px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--sand);
    flex-shrink:0;
  }
  .topbar .brand{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:26px;
    letter-spacing:0.5px;
    color:var(--cream);
  }
  .topbar .brand .dot-mark{color:var(--sand);}
  .topbar .sub{font-size:12px; color:#b7c9ba;}

  .screen{flex:1; display:flex; flex-direction:column; overflow-y:auto;}

  /* ---------- Setup screen ---------- */
  .setup-wrap{
    padding:22px 20px 40px;
    max-width:520px;
    margin:0 auto;
    width:100%;
  }
  .setup-hero{
    color:var(--cream);
    margin-bottom:22px;
  }
  .setup-hero h1{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:44px;
    line-height:0.95;
    margin:0 0 6px;
  }
  .setup-hero h1 .num{color:var(--sand);}
  .setup-hero p{margin:0; color:#c3d2c5; font-size:14.5px; line-height:1.5; max-width:38ch;}

  .field-card{
    background:var(--card);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:10px;
    box-shadow:0 1px 0 rgba(0,0,0,0.15);
  }
  .field-row{display:flex; gap:10px; align-items:center;}
  .field-row .n{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:700;
    font-size:20px;
    color:var(--sand-dark);
    width:22px;
    flex-shrink:0;
    text-align:center;
  }
  .field-row input[type=text]{
    flex:1;
    border:none;
    border-bottom:2px solid var(--line);
    background:transparent;
    font-size:16px;
    padding:6px 2px;
    color:var(--ink);
    min-width:0;
  }
  .field-row input[type=text]:focus{outline:none; border-bottom-color:var(--turf);}
  .field-row .hcp-wrap{
    display:flex; align-items:center; gap:6px; flex-shrink:0;
  }
  .field-row .hcp-wrap label{font-size:11px; color:var(--ink-soft); text-align:center;}
  .field-row input[type=number]{
    width:44px;
    border:none;
    border-bottom:2px solid var(--line);
    background:transparent;
    font-size:16px;
    padding:6px 2px;
    text-align:center;
    color:var(--ink);
  }
  .field-row input[type=number]:focus{outline:none; border-bottom-color:var(--turf);}
  .sign-toggle{
    width:28px; height:28px;
    border-radius:7px;
    border:1.5px solid var(--line);
    background:var(--cream);
    color:var(--ink-soft);
    font-weight:700;
    font-size:15px;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .sign-toggle.plus{
    background:var(--flag);
    border-color:var(--flag);
    color:#fff;
  }

  .course-note{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:10px;
    padding:12px 14px;
    color:#c3d2c5;
    font-size:12.5px;
    line-height:1.5;
    margin:16px 0 22px;
  }
  .course-note b{color:var(--cream);}

  .btn-primary{
    display:block;
    width:100%;
    background:var(--sand);
    color:var(--turf-dark);
    border:none;
    border-radius:10px;
    padding:16px;
    font-size:17px;
    font-weight:700;
    letter-spacing:0.2px;
  }
  .btn-primary:active{background:var(--sand-dark);}
  .btn-primary:disabled{opacity:0.4;}

  .btn-secondary{
    display:block;
    width:100%;
    background:transparent;
    color:var(--cream);
    border:1.5px solid rgba(255,255,255,0.3);
    border-radius:10px;
    padding:13px;
    font-size:14.5px;
    font-weight:600;
    margin-top:10px;
  }

  /* ---------- Play screen ---------- */
  .hole-strip{
    display:flex;
    overflow-x:auto;
    gap:6px;
    padding:10px 14px;
    background:var(--turf);
    flex-shrink:0;
    -webkit-overflow-scrolling:touch;
  }
  .hole-strip::-webkit-scrollbar{display:none;}
  .hole-chip{
    flex-shrink:0;
    width:38px;
    height:38px;
    border-radius:8px;
    border:none;
    background:rgba(255,255,255,0.12);
    color:#d7e3d9;
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:700;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .hole-chip.done{background:rgba(201,166,107,0.35); color:var(--cream);}
  .hole-chip.active{background:var(--sand); color:var(--turf-dark);}

  .hole-header{
    background:var(--cream);
    padding:16px 20px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .hole-header .hole-big{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:40px;
    line-height:1;
    color:var(--turf-dark);
  }
  .hole-header .hole-big .label{
    display:block;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.4px;
    color:var(--ink-soft);
    font-family:'Work Sans', sans-serif;
  }
  .badge-group{display:flex; gap:8px;}
  .badge{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:6px 12px;
    text-align:center;
    min-width:56px;
  }
  .badge .v{font-family:'Big Shoulders Display', sans-serif; font-weight:700; font-size:20px; color:var(--turf); display:block;}
  .badge .l{font-size:9.5px; color:var(--ink-soft); letter-spacing:0.4px;}

  .players-list{
    padding:14px 16px 100px;
    max-width:560px;
    margin:0 auto;
    width:100%;
  }
  .player-row{
    background:var(--card);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 1px 0 rgba(0,0,0,0.06);
  }
  .player-info{flex:1; min-width:0;}
  .player-info .name{font-weight:600; font-size:15.5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .player-info .meta{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .dot-badge{
    flex-shrink:0;
    width:52px;
    text-align:center;
  }
  .dot-badge .dv{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:24px;
    color:var(--sand-dark);
    line-height:1;
  }
  .dot-badge .dl{
    font-size:9.5px;
    color:var(--ink-soft);
    letter-spacing:0.3px;
  }
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:16px; height:16px;
    border-radius:8px;
    padding:0 4px;
    background:var(--sand);
    color:#fff;
    font-size:10px;
    margin-left:4px;
  }
  .stroke-pip.give{background:var(--flag);}

  .totals-bar{
    display:flex;
    gap:8px;
    padding:10px 16px;
    background:var(--cream);
    border-bottom:1px solid var(--line);
    overflow-x:auto;
    flex-shrink:0;
    -webkit-overflow-scrolling:touch;
  }
  .totals-bar::-webkit-scrollbar{display:none;}
  .totals-chip{
    flex-shrink:0;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:9px;
    padding:6px 10px;
    text-align:center;
    min-width:64px;
  }
  .totals-chip .tn{
    font-size:10.5px;
    color:var(--ink-soft);
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:70px;
  }
  .totals-chip .td{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:19px;
    color:var(--turf);
    line-height:1.1;
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:0;
    background:var(--cream);
    border-radius:10px;
    overflow:hidden;
    flex-shrink:0;
  }
  .stepper button{
    width:38px; height:44px;
    border:none;
    background:transparent;
    font-size:20px;
    font-weight:700;
    color:var(--turf);
  }
  .stepper button:active{background:rgba(0,0,0,0.06);}
  .stepper .score-val{
    width:38px;
    text-align:center;
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:22px;
    color:var(--ink);
  }

  .bottom-bar{
    position:sticky;
    bottom:0;
    background:var(--turf-dark);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top:2px solid var(--sand);
    display:flex;
    gap:10px;
    flex-shrink:0;
  }
  .bottom-bar button{flex:1; border-radius:10px; border:none; padding:14px; font-weight:700; font-size:15px;}
  .btn-nav-back{background:rgba(255,255,255,0.1); color:var(--cream);}
  .btn-nav-next{background:var(--sand); color:var(--turf-dark);}
  .btn-nav-next:disabled{opacity:0.4;}

  /* ---------- Leaderboard ---------- */
  .tabbar{
    display:flex;
    background:var(--turf);
    flex-shrink:0;
  }
  .tabbar button{
    flex:1;
    background:none;
    border:none;
    color:#a9c0ac;
    padding:11px 0;
    font-size:13.5px;
    font-weight:600;
    border-bottom:3px solid transparent;
  }
  .tabbar button.active{color:var(--cream); border-bottom-color:var(--sand);}

  .leaderboard{padding:16px; max-width:560px; margin:0 auto; width:100%;}
  .lb-row{
    display:flex;
    align-items:center;
    background:var(--card);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:8px;
    gap:12px;
  }
  .lb-rank{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:20px;
    color:var(--sand-dark);
    width:22px;
  }
  .lb-name{flex:1; font-weight:600; font-size:15px;}
  .lb-thru{font-size:11px; color:var(--ink-soft);}
  .lb-dots{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:24px;
    color:var(--turf);
  }

  .holebyhole{padding:8px 14px 20px; overflow-x:auto;}
  table.hbh{border-collapse:collapse; width:100%; font-size:12.5px;}
  table.hbh th, table.hbh td{
    padding:6px 5px;
    text-align:center;
    border-bottom:1px solid var(--line);
    min-width:26px;
  }
  table.hbh th{color:#cfe0d1; font-weight:600; position:sticky; top:0;}
  table.hbh td.namecell, table.hbh th.namecell{
    text-align:left; position:sticky; left:0; background:var(--cream);
    min-width:70px; font-weight:600;
  }
  .hbh-wrap{background:var(--cream); border-radius:10px; padding:4px 0 6px;}
  .hbh-wrap table.hbh th{background:var(--cream); color:var(--ink-soft); font-size:10.5px;}
  .totrow td{font-weight:700; color:var(--turf);}

  .empty-note{color:var(--ink-soft); font-size:13px; text-align:center; padding:30px 20px;}

  /* ---------- Final screen ---------- */
  .final-wrap{padding:26px 20px 40px; max-width:520px; margin:0 auto; width:100%;}
  .final-wrap h1{
    font-family:'Big Shoulders Display', sans-serif;
    color:var(--cream);
    font-size:32px;
    margin:0 0 4px;
  }
  .final-wrap .sub{color:#c3d2c5; font-size:13.5px; margin-bottom:20px;}
  .podium-row{
    display:flex;
    align-items:center;
    background:var(--card);
    border-radius:12px;
    padding:16px;
    margin-bottom:10px;
    gap:14px;
  }
  .podium-row.first{border:2px solid var(--sand);}
  .podium-rank{font-family:'Big Shoulders Display', sans-serif; font-weight:800; font-size:28px; color:var(--sand-dark); width:32px;}
  .podium-name{flex:1; font-weight:700; font-size:17px;}
  .podium-dots{font-family:'Big Shoulders Display', sans-serif; font-weight:800; font-size:30px; color:var(--turf);}

  ::-webkit-scrollbar{width:0; height:0;}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="brand">25<span class="dot-mark">·</span>Dot</div>
  </div>
  <div class="sub" id="topbarSub"></div>
</div>

<div class="screen" id="screen"></div>

<script>
/* ---------------- Course data (Blue tees) ---------------- */
const HOLES = [
  {n:1,  par:5, si:15}, {n:2,  par:4, si:7},  {n:3,  par:4, si:11},
  {n:4,  par:3, si:3},  {n:5,  par:4, si:1},  {n:6,  par:5, si:13},
  {n:7,  par:3, si:17}, {n:8,  par:4, si:5},  {n:9,  par:4, si:9},
  {n:10, par:4, si:2},  {n:11, par:5, si:18}, {n:12, par:3, si:14},
  {n:13, par:4, si:12}, {n:14, par:4, si:4},  {n:15, par:3, si:16},
  {n:16, par:4, si:8},  {n:17, par:5, si:10}, {n:18, par:4, si:6}
];
const SLOTS = [9,7,5,3,1];
const NUM_PLAYERS = 5;

/* ---------------- State ---------------- */
let state = {
  phase: 'setup', // setup | play | final
  players: [], // {name, hcp}
  scores: Array.from({length:18}, () => Array(NUM_PLAYERS).fill(null)),
  currentHole: 0,
  activeTab: 'score' // score | board
};

// signedHcp: positive = receives strokes (allocated from hardest hole, si 1, upward)
//            negative = plus handicap, gives strokes back (allocated from easiest hole, si 18, downward)
function strokesForHole(signedHcp, si){
  if (signedHcp >= 0){
    const h = Math.round(signedHcp);
    const extra = Math.floor(h/18);
    const rem = h - extra*18;
    return extra + (si <= rem ? 1 : 0);
  } else {
    const m = Math.round(-signedHcp);
    const extra = Math.floor(m/18);
    const rem = m - extra*18;
    const give = si > (18 - rem) ? 1 : 0;
    return -(extra + give);
  }
}

function effectiveHcp(p){
  return p.plus ? -p.hcp : p.hcp;
}

function netScore(gross, signedHcp, si){
  return gross - strokesForHole(signedHcp, si);
}

function dotsForHole(holeIdx){
  const scores = state.scores[holeIdx];
  if (scores.some(s => s === null)) return null;
  const hole = HOLES[holeIdx];
  const rows = scores.map((gross, i) => ({
    i, net: netScore(gross, effectiveHcp(state.players[i]), hole.si)
  }));
  rows.sort((a,b) => a.net - b.net);
  const dots = Array(NUM_PLAYERS).fill(0);
  let idx = 0;
  while (idx < NUM_PLAYERS){
    let j = idx;
    while (j+1 < NUM_PLAYERS && rows[j+1].net === rows[idx].net) j++;
    const slice = SLOTS.slice(idx, j+1);
    const avg = slice.reduce((a,b)=>a+b,0) / slice.length;
    for (let k = idx; k <= j; k++) dots[rows[k].i] = avg;
    idx = j+1;
  }
  return dots;
}

function totalsThroughHole(uptoIdx){
  const totals = Array(NUM_PLAYERS).fill(0);
  let thru = 0;
  for (let h=0; h<=uptoIdx; h++){
    const d = dotsForHole(h);
    if (d){ thru = h+1; d.forEach((v,i)=> totals[i]+=v); }
  }
  return {totals, thru};
}

function fmtDots(n){
  return (Math.round(n*2)/2).toString().replace(/\.0$/,'').replace(/\.5$/,'.5');
}

function strokePipHtml(strokes){
  if (strokes === 0) return '';
  if (strokes > 0) return ` <span class="stroke-pip">${strokes}</span>`;
  return ` <span class="stroke-pip give">${strokes}</span>`;
}

function updateHoleDots(){
  const d = dotsForHole(state.currentHole);
  document.querySelectorAll('.dot-badge').forEach(badge => {
    const i = +badge.dataset.player;
    const dv = badge.querySelector('.dv');
    dv.textContent = d ? fmtDots(d[i]) : '\u2013';
  });
}

function updateTotalsBar(){
  const bar = document.getElementById('totalsBar');
  if (!bar) return;
  const {totals} = totalsThroughHole(17);
  bar.innerHTML = state.players.map((p, i) => `
    <div class="totals-chip">
      <div class="tn">${escapeHtml(shortName(p.name))}</div>
      <div class="td">${fmtDots(totals[i])}</div>
    </div>
  `).join('');
}

function shortName(name){
  const trimmed = name.trim();
  return trimmed.length > 10 ? trimmed.slice(0,9) + '\u2026' : (trimmed || 'Player');
}

/* ---------------- Rendering ---------------- */
const screen = document.getElementById('screen');
const topbarSub = document.getElementById('topbarSub');

function render(){
  if (state.phase === 'setup') renderSetup();
  else if (state.phase === 'play') renderPlay();
  else renderFinal();
}

function renderSetup(){
  topbarSub.textContent = '';
  if (state.players.length === 0){
    state.players = Array.from({length:NUM_PLAYERS}, () => ({name:'', hcp:0, plus:false}));
  }
  const wrap = document.createElement('div');
  wrap.className = 'setup-wrap';
  wrap.innerHTML = `
    <div class="setup-hero">
      <h1>25<span class="num">·</span>Dot</h1>
      <p>Five players. Twenty-five dots a hole, split 9&ndash;7&ndash;5&ndash;3&ndash;1 by net score. Enter your group and handicaps to start.</p>
    </div>
    <div id="fields"></div>
    <div class="course-note"><b>Blue tees</b> &mdash; par and stroke index are already loaded for this course. Handicaps below allocate strokes automatically per hole. Tap the sign next to a handicap to mark a <b>plus handicap</b> &mdash; those strokes are given back starting on the easiest holes.</div>
    <button class="btn-primary" id="startBtn">Start Round</button>
  `;
  screen.innerHTML = '';
  screen.appendChild(wrap);

  const fields = wrap.querySelector('#fields');
  state.players.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'field-card';
    row.innerHTML = `
      <div class="field-row">
        <span class="n">${i+1}</span>
        <input type="text" placeholder="Player name" value="${p.name}" data-i="${i}" class="nameInput">
        <div class="hcp-wrap">
          <button class="sign-toggle${p.plus ? ' plus' : ''}" data-i="${i}" type="button">${p.plus ? '+' : '\u2212'}</button>
          <input type="number" min="0" placeholder="0" value="${p.hcp === 0 ? '' : p.hcp}" data-i="${i}" class="hcpInput" inputmode="numeric">
          <label>Hdcp</label>
        </div>
      </div>
    `;
    fields.appendChild(row);
  });

  fields.querySelectorAll('.nameInput').forEach(inp => {
    inp.addEventListener('input', e => {
      state.players[+e.target.dataset.i].name = e.target.value;
      checkStartEnabled();
    });
  });
  fields.querySelectorAll('.hcpInput').forEach(inp => {
    inp.addEventListener('input', e => {
      state.players[+e.target.dataset.i].hcp = Math.abs(parseFloat(e.target.value) || 0);
    });
  });
  fields.querySelectorAll('.sign-toggle').forEach(btn => {
    btn.addEventListener('click', e => {
      const i = +e.target.dataset.i;
      state.players[i].plus = !state.players[i].plus;
      e.target.classList.toggle('plus', state.players[i].plus);
      e.target.textContent = state.players[i].plus ? '+' : '\u2212';
    });
  });

  const startBtn = wrap.querySelector('#startBtn');
  startBtn.addEventListener('click', () => {
    if (!allNamesFilled()) return;
    state.phase = 'play';
    state.currentHole = 0;
    render();
  });
  checkStartEnabled();

  function allNamesFilled(){
    return state.players.every(p => p.name.trim().length > 0);
  }
  function checkStartEnabled(){
    startBtn.disabled = !allNamesFilled();
  }
}

function renderPlay(){
  const hole = HOLES[state.currentHole];
  topbarSub.textContent = `Hole ${hole.n} of 18`;

  const wrap = document.createElement('div');
  wrap.style.display = 'flex';
  wrap.style.flexDirection = 'column';
  wrap.style.flex = '1';
  wrap.style.minHeight = '0';

  wrap.innerHTML = `
    <div class="tabbar">
      <button data-tab="score" class="${state.activeTab==='score'?'active':''}">Score</button>
      <button data-tab="board" class="${state.activeTab==='board'?'active':''}">Leaderboard</button>
    </div>
  `;

  if (state.activeTab === 'score'){
    // Default any unset scores on the hole being viewed to par, so the round
    // can advance without requiring a tap on every player who made par.
    state.scores[state.currentHole] = state.scores[state.currentHole].map(
      s => s === null ? hole.par : s
    );

    const holeStrip = document.createElement('div');
    holeStrip.className = 'hole-strip';
    HOLES.forEach((h, i) => {
      const chip = document.createElement('button');
      const complete = state.scores[i].every(s => s !== null);
      chip.className = 'hole-chip' + (i===state.currentHole?' active':'') + (complete?' done':'');
      chip.textContent = h.n;
      chip.addEventListener('click', () => { state.currentHole = i; render(); });
      holeStrip.appendChild(chip);
    });
    wrap.appendChild(holeStrip);

    const header = document.createElement('div');
    header.className = 'hole-header';
    header.innerHTML = `
      <div class="hole-big"><span class="label">Hole</span>${hole.n}</div>
      <div class="badge-group">
        <div class="badge"><span class="v">${hole.par}</span><span class="l">PAR</span></div>
        <div class="badge"><span class="v">${hole.si}</span><span class="l">HDCP</span></div>
      </div>
    `;
    wrap.appendChild(header);

    const totalsBar = document.createElement('div');
    totalsBar.className = 'totals-bar';
    totalsBar.id = 'totalsBar';
    wrap.appendChild(totalsBar);

    const list = document.createElement('div');
    list.className = 'players-list';
    state.players.forEach((p, i) => {
      const hcp = effectiveHcp(p);
      const strokes = strokesForHole(hcp, hole.si);
      const gross = state.scores[state.currentHole][i];
      const val = gross === null ? hole.par : gross;
      const row = document.createElement('div');
      row.className = 'player-row';
      row.innerHTML = `
        <div class="player-info">
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="meta">Net ${gross===null ? '&ndash;' : netScore(gross, hcp, hole.si)}${strokePipHtml(strokes)}</div>
        </div>
        <div class="dot-badge" data-player="${i}">
          <div class="dv">&ndash;</div>
          <div class="dl">dots</div>
        </div>
        <div class="stepper">
          <button class="dec">&minus;</button>
          <span class="score-val">${val}</span>
          <button class="inc">+</button>
        </div>
      `;
      const dec = row.querySelector('.dec');
      const inc = row.querySelector('.inc');
      const valEl = row.querySelector('.score-val');
      const metaEl = row.querySelector('.meta');
      function setScore(newVal){
        newVal = Math.max(1, Math.min(15, newVal));
        state.scores[state.currentHole][i] = newVal;
        valEl.textContent = newVal;
        metaEl.innerHTML = `Net ${netScore(newVal, hcp, hole.si)}${strokePipHtml(strokes)}`;
        updateNextButton();
        updateTotalsBar();
        updateHoleDots();
      }
      dec.addEventListener('click', () => setScore((state.scores[state.currentHole][i] ?? hole.par) - 1));
      inc.addEventListener('click', () => setScore((state.scores[state.currentHole][i] ?? hole.par) + 1));
      list.appendChild(row);
    });
    wrap.appendChild(list);

    const bar = document.createElement('div');
    bar.className = 'bottom-bar';
    bar.innerHTML = `
      <button class="btn-nav-back" id="prevHole" ${state.currentHole===0?'disabled':''}>Back</button>
      <button class="btn-nav-next" id="nextHole">${state.currentHole===17 ? 'Finish Round' : 'Next Hole'}</button>
    `;
    wrap.appendChild(bar);

    bar.querySelector('#prevHole').addEventListener('click', () => {
      if (state.currentHole > 0){ state.currentHole--; render(); }
    });
    bar.querySelector('#nextHole').addEventListener('click', () => {
      const allEntered = state.scores[state.currentHole].every(s => s !== null);
      if (!allEntered) return;
      if (state.currentHole === 17){ state.phase = 'final'; render(); return; }
      state.currentHole++;
      render();
    });

    screen.innerHTML = '';
    screen.appendChild(wrap);
    updateNextButton();
    updateTotalsBar();
    updateHoleDots();

    function updateNextButton(){
      const btn = document.getElementById('nextHole');
      if (!btn) return;
      btn.disabled = !state.scores[state.currentHole].every(s => s !== null);
    }
  } else {
    renderLeaderboardInto(wrap, true);
    screen.innerHTML = '';
    screen.appendChild(wrap);
  }

  wrap.querySelectorAll('.tabbar button').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeTab = btn.dataset.tab;
      render();
    });
  });
}

function renderLeaderboardInto(container, scrollable){
  const {totals, thru} = totalsThroughHole(17);
  const order = state.players.map((p,i) => ({...p, i, total: totals[i]}))
    .sort((a,b) => b.total - a.total);

  const lb = document.createElement('div');
  lb.className = 'leaderboard';
  if (thru === 0){
    lb.innerHTML = `<div class="empty-note">Enter scores for hole 1 to see dot totals.</div>`;
  } else {
    order.forEach((p, rank) => {
      const row = document.createElement('div');
      row.className = 'lb-row';
      row.innerHTML = `
        <div class="lb-rank">${rank+1}</div>
        <div>
          <div class="lb-name">${escapeHtml(p.name)}</div>
          <div class="lb-thru">thru ${thru}</div>
        </div>
        <div class="lb-dots" style="margin-left:auto">${fmtDots(p.total)}</div>
      `;
      lb.appendChild(row);
    });

    const hbhWrap = document.createElement('div');
    hbhWrap.className = 'holebyhole';
    hbhWrap.innerHTML = buildHoleByHoleTable();
    lb.appendChild(hbhWrap);
  }
  container.appendChild(lb);
}

function buildHoleByHoleTable(){
  let rows = '';
  state.players.forEach((p, i) => {
    let cells = '';
    let total = 0;
    for (let h=0; h<18; h++){
      const d = dotsForHole(h);
      if (d){ cells += `<td>${fmtDots(d[i])}</td>`; total += d[i]; }
      else cells += `<td>&ndash;</td>`;
    }
    rows += `<tr><td class="namecell">${escapeHtml(p.name)}</td>${cells}<td style="font-weight:700;color:var(--turf)">${fmtDots(total)}</td></tr>`;
  });
  let headerCells = '';
  for (let h=1; h<=18; h++) headerCells += `<th>${h}</th>`;
  return `<div class="hbh-wrap"><table class="hbh">
    <thead><tr><th class="namecell">Player</th>${headerCells}<th>Tot</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function renderFinal(){
  topbarSub.textContent = 'Final';
  const {totals} = totalsThroughHole(17);
  const order = state.players.map((p,i) => ({...p, i, total: totals[i]}))
    .sort((a,b) => b.total - a.total);

  const wrap = document.createElement('div');
  wrap.className = 'final-wrap';
  wrap.innerHTML = `
    <h1>Final Standings</h1>
    <div class="sub">25 Dot &middot; 18 holes complete</div>
    <div id="podium"></div>
    <button class="btn-secondary" id="reviewBtn">Review Hole-by-Hole</button>
    <button class="btn-secondary" id="newRoundBtn">Start New Round</button>
  `;
  const podium = wrap.querySelector('#podium');
  order.forEach((p, rank) => {
    const row = document.createElement('div');
    row.className = 'podium-row' + (rank===0 ? ' first' : '');
    row.innerHTML = `
      <div class="podium-rank">${rank+1}</div>
      <div class="podium-name">${escapeHtml(p.name)}</div>
      <div class="podium-dots">${fmtDots(p.total)}</div>
    `;
    podium.appendChild(row);
  });

  screen.innerHTML = '';
  screen.appendChild(wrap);

  wrap.querySelector('#reviewBtn').addEventListener('click', () => {
    const hbhWrap = document.createElement('div');
    hbhWrap.innerHTML = buildHoleByHoleTable();
    hbhWrap.style.margin = '18px 0';
    wrap.insertBefore(hbhWrap, wrap.querySelector('#reviewBtn'));
    wrap.querySelector('#reviewBtn').remove();
  });
  wrap.querySelector('#newRoundBtn').addEventListener('click', () => {
    if (!confirm('Start a new round? This clears all current scores.')) return;
    state = {
      phase: 'setup',
      players: state.players.map(p => ({name:p.name, hcp:p.hcp, plus:p.plus})),
      scores: Array.from({length:18}, () => Array(NUM_PLAYERS).fill(null)),
      currentHole: 0,
      activeTab: 'score'
    };
    render();
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

render();
</script>
</body>
</html>
